name = "adaptive-measurement"
type = "web_pixel_extension"
uid = "9799ce6c-b318-995d-baa9-c13a2d72dbc4e4ffc9c3"

runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = true
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.endpoint]
name = "Collection endpoint"
description = "HTTPS endpoint owned by Pagnetic"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.shop]
name = "Shop domain"
description = "Merchant binding for measurement events"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.token]
name = "Ingestion token"
description = "Rotatable secret for authenticated event ingestion"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "32" }
]
